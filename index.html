<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.13);
  --text:#f4f5f8;--muted:rgba(244,245,248,.6);--accent:#4c9bff;--danger:#ff5a52;
  --font:Inter,"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--text);background:#07080c;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit;color:inherit;outline:none}
.hidden{display:none!important}

/* Fondo */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#07080c}
#stack{position:absolute;inset:0;transition:filter .4s,transform .4s}
#layer,#bgimg{position:absolute;inset:0;width:100%;height:100%}
#bgimg{object-fit:cover;opacity:0;transition:opacity .9s}
#bgimg.on{opacity:1}
#orbs{position:absolute;inset:0;opacity:0;transition:opacity .8s}
#orbs.on{opacity:1}
#orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75}
#orbs i:nth-child(1){width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:var(--o1);animation:f1 26s ease-in-out infinite alternate}
#orbs i:nth-child(2){width:55vmax;height:55vmax;right:-18vmax;bottom:-22vmax;background:var(--o2);animation:f2 32s ease-in-out infinite alternate}
#orbs i:nth-child(3){width:38vmax;height:38vmax;left:35%;top:30%;background:var(--o3);opacity:.45;animation:f3 38s ease-in-out infinite alternate}
#dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .4s;pointer-events:none}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.5) 100%);pointer-events:none}
@keyframes f1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes f2{to{transform:translate(-10vmax,-8vmax) scale(1.1)}}
@keyframes f3{to{transform:translate(-14vmax,8vmax) scale(.85)}}

.screen{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.02);transition:opacity .5s var(--ease),transform .5s var(--ease),visibility .5s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09)}
.err{min-height:18px;font-size:13px;color:var(--danger)}
.btn{padding:11px 22px;border-radius:999px;background:var(--glass2);font-size:14px;font-weight:500;transition:background .2s,transform .15s,filter .2s}
.btn:hover{background:var(--accent)}.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent)}.btn.pri:hover{filter:brightness(1.12)}
.btn.dng{color:var(--danger)}.btn.dng:hover{background:var(--danger);color:#fff}
.ghost{font-size:13px;color:var(--muted);padding:6px 12px;border-radius:999px;transition:color .2s,background .2s}
.ghost:hover{color:var(--text);background:var(--glass)}
.field{width:100%;padding:12px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:14px;transition:border-color .2s,background .2s}
.field:focus{border-color:var(--accent);background:var(--glass2)}
.field::placeholder{color:var(--muted)}
.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:500;color:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:104px;height:104px;font-size:40px}.avatar.sm{width:30px;height:30px;font-size:13px;box-shadow:none}
.pop{opacity:0;visibility:hidden;transform:translateY(10px) scale(.97);transition:.28s var(--ease);background:rgba(22,24,32,.8)}
.pop.open{opacity:1;visibility:visible;transform:none}

/* Bloqueo */
#lock{display:flex;flex-direction:column;align-items:center;padding:max(8vh,36px) 24px 24px;overflow-y:auto}
.l-time{font-size:clamp(68px,15vw,128px);font-weight:200;letter-spacing:-4px;line-height:1;font-variant-numeric:tabular-nums}
.l-date{margin-top:10px;font-size:clamp(15px,2.4vw,19px);color:var(--muted);text-transform:capitalize}
.stage{flex:1;width:100%;display:grid;place-items:center;margin-top:3vh}
.view{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px);transition:opacity .4s var(--ease),transform .4s var(--ease),visibility .4s}
.view.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.profiles{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;max-width:760px}
.profile{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 20px;border-radius:26px;transition:transform .3s var(--ease),background .3s;min-width:128px}
.profile:hover{transform:translateY(-5px);background:var(--glass)}.profile:active{transform:scale(.97)}
.profile span{font-size:15px;font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile.add .avatar{background:var(--glass);border:1.5px dashed rgba(255,255,255,.35);backdrop-filter:blur(20px);box-shadow:none;transition:background .3s}
.profile.add:hover .avatar{background:var(--glass2)}
.profile.add span{color:var(--muted)}
.pinwrap{position:relative;width:min(290px,80vw)}
.pinwrap input{width:100%;padding:14px 54px 14px 18px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:16px;letter-spacing:5px;backdrop-filter:blur(24px);transition:border-color .2s,background .2s}
.pinwrap input::placeholder{letter-spacing:0;color:var(--muted)}
.pinwrap input:focus{border-color:var(--accent);background:rgba(255,255,255,.14)}
.go{position:absolute;right:6px;top:6px;bottom:6px;width:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent);transition:transform .2s,filter .2s}
.go:hover{filter:brightness(1.12)}.go:active{transform:scale(.94)}
.pname{font-size:17px;font-weight:500}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* Modal */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.overlay.open{opacity:1;visibility:visible}
.dlg{width:min(430px,100%);max-height:100%;overflow-y:auto;padding:28px 26px 24px;border-radius:30px;background:rgba(24,26,34,.74);display:flex;flex-direction:column;gap:14px;transform:translateY(18px) scale(.97);transition:transform .4s var(--ease)}
.overlay.open .dlg{transform:none}
.dlg h2{font-size:21px;font-weight:600;text-align:center;letter-spacing:-.3px}
.dlg .sub{font-size:13px;color:var(--muted);text-align:center;margin-top:-8px}
.prev{align-self:center;padding:6px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.lab{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);font-size:16px;font-weight:600;transition:transform .2s,background .2s,border-color .2s}
.ic svg{width:20px;height:20px}
.ic:hover{transform:translateY(-2px);background:var(--glass2)}.ic.act{border-color:#fff;background:var(--glass2)}
.av{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s}
.av:hover{transform:scale(1.14)}.av.act{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}

/* Dashboard */
#app{overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1140px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 22px 100px;min-height:100%;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
.top .r{display:flex;align-items:center;gap:6px;position:relative}
.chip{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:999px;font-size:14px;font-weight:500}
.tb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 14px;border-radius:999px;transition:color .2s,background .2s}
.tb:hover,.tb.on{color:var(--text);background:var(--glass2)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:6px 4px 0}
.hello{font-size:clamp(26px,4.6vw,40px);font-weight:500;letter-spacing:-.8px}
.date{margin-top:6px;color:var(--muted);font-size:16px;text-transform:capitalize}
.clock{font-size:clamp(64px,13vw,124px);font-weight:200;letter-spacing:-5px;line-height:.9;font-variant-numeric:tabular-nums}
.clock small{font-size:.26em;letter-spacing:0;color:var(--muted);margin-left:8px;font-weight:300}
.searchwrap{position:relative}
.search{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;border-radius:999px}
.eng{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:500;transition:background .2s;white-space:nowrap}
.eng:hover,.eng.on{background:var(--glass2)}
.eng svg{opacity:.6}
.sep{width:1px;height:22px;background:var(--line);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;font-size:16px;padding:12px 6px}
.search input::placeholder{color:var(--muted)}
#emenu{position:absolute;left:8px;top:calc(100% + 8px);z-index:6;min-width:210px;padding:8px;border-radius:20px;display:flex;flex-direction:column;gap:2px}
#emenu button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 14px;border-radius:12px;font-size:14px;transition:background .15s}
#emenu button:hover{background:var(--glass2)}
#emenu button.act{background:var(--glass2);font-weight:600}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch;min-height:400px}
.grid.solo{grid-template-columns:1fr}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{border-radius:26px;padding:22px;display:flex;flex-direction:column;min-height:380px}
.card h2{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:16px;min-height:26px}
.mini{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);padding:5px 12px;border-radius:999px;background:var(--glass)}
.mini:hover,.mini.on{color:var(--text);background:var(--glass2)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start;flex:1}
.tile{position:relative;display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .25s var(--ease),background .25s}
.tile:hover{transform:translateY(-3px);background:var(--glass2)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:16px;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.05))}
.nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{display:none;position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--danger);font-size:15px;line-height:24px;text-align:center;color:#fff}
.editing .x{display:block}.editing .tile{outline:1px dashed rgba(255,255,255,.3)}
.empty{color:var(--muted);font-size:14px;grid-column:1/-1}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.add .field{flex:1;min-width:110px;width:auto}
.add .btn{border-radius:12px;padding:11px 18px;background:var(--accent)}
textarea#notes{flex:1;width:100%;min-height:300px;resize:none;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:15px;line-height:1.65}
textarea#notes:focus{border-color:rgba(255,255,255,.3)}
#saved{opacity:0;transition:opacity .4s;font-size:12px;text-transform:none;letter-spacing:0;font-weight:400}

/* Popovers de ajustes */
#gear{position:fixed;right:20px;bottom:max(20px,env(safe-area-inset-bottom));z-index:5;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--ease)}
#gear:hover{transform:rotate(70deg)}
#panel{position:fixed;right:20px;bottom:88px;z-index:5;width:min(370px,calc(100vw - 40px));max-height:calc(100vh - 120px);overflow-y:auto;padding:20px;border-radius:24px}
#wpanel{position:absolute;right:0;top:calc(100% + 8px);z-index:6;width:min(300px,calc(100vw - 44px));padding:16px;border-radius:22px}
h3.t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:0 0 10px;font-weight:600}
#panel h3.t:not(:first-child){margin-top:22px}
#panel h4{font-size:12px;color:var(--muted);font-weight:500;margin:12px 0 8px}
.sws{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sw{aspect-ratio:16/10;border-radius:11px;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s;background-size:cover}
.sw:hover{transform:scale(1.06)}.sw.act{border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{border-radius:12px}
.msg{font-size:12px;color:var(--muted);min-height:16px;margin-top:6px}
.sl{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:6px}
.sl span{width:84px;flex:none}.sl input{flex:1;accent-color:var(--accent)}
.sw-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-size:14px}
.tg{width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .25s;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tg.on{background:var(--accent)}.tg.on:after{transform:translateX(18px)}
#wpanel .stack{margin-top:10px}
</style>
</head>
<body>
<div id="bg">
  <div id="stack"><div id="layer"></div><img id="bgimg" alt="" referrerpolicy="no-referrer"><div id="orbs"><i></i><i></i><i></i></div></div>
  <div id="dim"></div>
</div>

<!-- BLOQUEO -->
<section id="lock" class="screen active">
  <div class="l-time" id="lTime">00:00</div>
  <div class="l-date" id="lDate"></div>
  <div class="stage">
    <div class="view on" id="vUsers"><div class="profiles" id="profiles"></div></div>
    <div class="view" id="vPin">
      <div id="pAvatarBox"></div>
      <div class="pname" id="pName"></div>
      <div class="pinwrap">
        <input type="password" id="pin" placeholder="PIN o contraseña" autocomplete="off" maxlength="64">
        <button type="button" class="go" id="go" aria-label="Entrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="err" id="err"></div>
      <button type="button" class="ghost" id="back">Cambiar de usuario</button>
    </div>
  </div>
</section>

<!-- PANEL -->
<main id="app" class="screen">
  <div class="wrap">
    <div class="top">
      <div class="chip glass" id="chip"></div>
      <div class="r">
        <button type="button" class="tb" id="wBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
          Personalizar
        </button>
        <button type="button" class="tb" id="logout">Cerrar sesión</button>
        <div id="wpanel" class="pop glass">
          <h3 class="t">Widgets</h3>
          <div class="sw-row">Búsqueda<button type="button" class="tg" data-w="search" aria-label="Búsqueda"></button></div>
          <div class="sw-row">Accesos directos<button type="button" class="tg" data-w="links" aria-label="Accesos directos"></button></div>
          <div class="sw-row">Bloc de notas<button type="button" class="tg" data-w="notes" aria-label="Bloc de notas"></button></div>
          <div class="stack">
            <button type="button" class="btn" id="wSwap">Intercambiar posición</button>
            <button type="button" class="btn" id="wReset">Restablecer</button>
          </div>
        </div>
      </div>
    </div>
    <div class="hero">
      <div><h1 class="hello" id="hello"></h1><div class="date" id="date"></div></div>
      <div class="clock"><span id="clock">00:00</span><small id="secs">00</small></div>
    </div>
    <div class="searchwrap" id="searchWrap">
      <div class="search glass">
        <button type="button" class="eng" id="eBtn"><span id="eName">Google</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sep"></div>
        <input id="q" type="text" placeholder="Buscar en Google" autocomplete="off">
        <button type="button" class="btn" id="qgo">Buscar</button>
      </div>
      <div id="emenu" class="pop glass"></div>
    </div>
    <div class="grid" id="grid">
      <section class="card glass" id="cLinks">
        <h2>Accesos directos <button type="button" class="mini" id="editBtn">Editar</button></h2>
        <div class="links" id="links"></div>
        <div class="add">
          <input class="field" id="lName" placeholder="Nombre" maxlength="24">
          <input class="field" id="lUrl" placeholder="dominio.com">
          <button type="button" class="btn" id="lAdd">Añadir</button>
        </div>
      </section>
      <section class="card glass" id="cNotes">
        <h2>Bloc de notas privado <span id="saved">Guardado</span></h2>
        <textarea id="notes" placeholder="Escribe aquí. Se guarda automáticamente."></textarea>
      </section>
    </div>
  </div>
  <button type="button" id="gear" class="glass" aria-label="Ajustes">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4" fill="#0b0d12"/><circle cx="15" cy="17" r="2.4" fill="#0b0d12"/></svg>
  </button>
  <div id="panel" class="pop glass">
    <h3 class="t">Fondo de pantalla</h3>
    <div id="bgGroups"></div>
    <h4>Ajuste de imagen</h4>
    <div class="sl"><span>Desenfoque</span><input type="range" id="rBlur" min="0" max="20" step="1"></div>
    <div class="sl"><span>Oscurecer</span><input type="range" id="rDim" min="0" max="70" step="1"></div>
    <h4>Imagen por URL</h4>
    <div class="stack">
      <input class="field" id="bgUrl" placeholder="Pega aquí el enlace directo de una imagen" autocomplete="off">
      <button type="button" class="btn" id="bgApply">Usar esta imagen</button>
      <button type="button" class="btn" id="bgUp">Subir desde el dispositivo</button>
    </div>
    <div class="msg" id="bmsg"></div>
    <h3 class="t">Seguridad</h3>
    <div class="stack">
      <input class="field" type="password" id="oldPin" placeholder="PIN actual" autocomplete="off">
      <input class="field" type="password" id="newPin" placeholder="Nuevo PIN (mínimo 4)" autocomplete="off">
      <button type="button" class="btn" id="savePin">Cambiar PIN</button>
    </div>
    <div class="msg" id="pmsg"></div>
    <h3 class="t">Usuario</h3>
    <div class="stack"><button type="button" class="btn dng" id="delUser">Eliminar este usuario</button></div>
  </div>
</main>

<!-- MODAL NUEVO USUARIO -->
<div class="overlay" id="modal">
  <div class="dlg glass">
    <h2>Nuevo usuario</h2>
    <div class="sub">Tendrá su propio espacio privado</div>
    <div class="prev" id="mPrev"></div>

function hash(s){
  s='dash-os|'+s;var h1=0xdeadbeef,h2=0x41c6ce57,c,i;
  for(i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);

  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

}
function loadImg(u,cb,w){

function resizeFile(file,max,square,cb){

    im.onload=function(){
      var w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h,cw,ch;

    };

}

    var b=document.createElement('button');b.type='button';b.className=x[0]===e[0]?'act':'';b.textContent=x[1];
    if(x[0]===e[0])b.innerHTML+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
    b.addEventListener('click',function(){uset('engine',x[0]);renderEngines();closePops();$('q').focus()});
    m.appendChild(b);
  });
}
$('eBtn').addEventListener('click',function(ev){ev.stopPropagation();togglePop('emenu')});
function doSearch(){
  var q=$('q').value.trim();if(!q)return;
  window.open(curEngine()[2]+encodeURIComponent(q),'_blank','noopener');$('q').value='';
}
$('qgo').addEventListener('click',doSearch);
$('q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doSearch()}});

/* ---------- Widgets ---------- */
function getW(){var w={};try{w=JSON.parse(uget('widgets'))||{}}catch(e){}return {search:w.search===0?0:1,links:w.links===0?0:1,notes:w.notes===0?0:1,swap:w.swap?1:0}}
function setW(w){uset('widgets',JSON.stringify(w));applyWidgets()}
function applyWidgets(){
  var w=getW();
  $('searchWrap').classList.toggle('hidden',!w.search);
  $('cLinks').classList.toggle('hidden',!w.links);
  $('cNotes').classList.toggle('hidden',!w.notes);
  $('grid').classList.toggle('hidden',!w.links&&!w.notes);
  $('grid').classList.toggle('solo',!(w.links&&w.notes));
  $('cLinks').style.order=w.swap?2:1;$('cNotes').style.order=w.swap?1:2;
  var t=document.querySelectorAll('.tg');
  for(var i=0;i<t.length;i++)t[i].classList.toggle('on',!!w[t[i].getAttribute('data-w')]);
}
$('wBtn').addEventListener('click',function(ev){ev.stopPropagation();togglePop('wpanel')});
(function(){var t=document.querySelectorAll('.tg');for(var i=0;i<t.length;i++)t[i].addEventListener('click',function(){var w=getW(),k=this.getAttribute('data-w');w[k]=w[k]?0:1;setW(w)})})();
$('wSwap').addEventListener('click',function(){var w=getW();w.swap=w.swap?0:1;setW(w)});
$('wReset').addEventListener('click',function(){setW({search:1,links:1,notes:1,swap:0})});

/* ---------- Accesos directos ---------- */
function getLinks(){try{var v=JSON.parse(uget('links'));if(Array.isArray(v))return v}catch(e){}return DEF_LINKS.slice()}
function saveLinks(l){uset('links',JSON.stringify(l))}
function renderLinks(){
  var box=$('links'),arr=getLinks();box.innerHTML='';box.classList.toggle('editing',editMode);
  if(!arr.length){var e=document.createElement('div');e.className='empty';e.textContent='Sin accesos directos. Añade el primero abajo.';box.appendChild(e)}
  arr.forEach(function(l,i){
    var a=document.createElement('a');a.className='tile';a.href=l.u;a.target='_blank';a.rel='noopener noreferrer';
    var ico=document.createElement('div');ico.className='ico';ico.textContent=(l.n.charAt(0)||'?').toUpperCase();
    var nm=document.createElement('div');nm.className='nm';nm.textContent=l.n;
    var x=document.createElement('span');x.className='x';x.textContent='×';
    x.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();var all=getLinks();all.splice(i,1);saveLinks(all);resetForm();renderLinks()});
    a.addEventListener('click',function(ev){
      if(!editMode)return;ev.preventDefault();editIdx=i;$('lName').value=l.n;$('lUrl').value=l.u;$('lAdd').textContent='Guardar';$('lName').focus();
    });
    a.appendChild(ico);a.appendChild(nm);a.appendChild(x);box.appendChild(a);
  });
}
function resetForm(){editIdx=-1;$('lName').value='';$('lUrl').value='';$('lAdd').textContent='Añadir'}
$('editBtn').addEventListener('click',function(){
  editMode=!editMode;this.classList.toggle('on',editMode);this.textContent=editMode?'Hecho':'Editar';
  if(!editMode)resetForm();renderLinks();
});
function addLink(){
  var n=$('lName').value.trim(),u=$('lUrl').value.trim();if(!n||!u)return;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){return}
  var arr=getLinks();
  if(editIdx>=0&&arr[editIdx])arr[editIdx]={n:n,u:u};else arr.push({n:n,u:u});
  saveLinks(arr);resetForm();renderLinks();
}
$('lAdd').addEventListener('click',addLink);
['lName','lUrl'].forEach(function(id){$(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addLink()}})});

/* ---------- Notas ---------- */
$('notes').addEventListener('input',function(){
  if(!current)return;var uid=current.id;
  var s=$('saved');s.style.opacity=1;s.textContent='Guardando…';clearTimeout(saveT);
  saveT=setTimeout(function(){sSet(uid+':notes',$('notes').value);s.textContent='Guardado';setTimeout(function(){s.style.opacity=0},1400)},250);
});
window.addEventListener('pagehide',flushNotes);
document.addEventListener('visibilitychange',function(){if(document.hidden)flushNotes()});
window.addEventListener('storage',function(e){
  if(e.key===P+'users'){loadUsers();if(!current)renderUsers()}
  else if(current&&e.key===P+current.id+':notes'&&document.activeElement!==$('notes'))$('notes').value=e.newValue||'';
});

/* ---------- Ajustes ---------- */
$('gear').addEventListener('click',function(ev){
  ev.stopPropagation();togglePop('panel');
  if($('panel').classList.contains('open')){renderBgPanel();$('bmsg').textContent=''}
});
function bgMsg(ok){$('bmsg').textContent=ok?'':'No se pudo cargar la imagen. Revisa el enlace o tu conexión.'}
function setBg(id){uset('bg',id);applyBg(id,bgMsg);renderBgPanel()}
function renderBgPanel(){
  var box=$('bgGroups'),cur=userBg();box.innerHTML='';
  GROUPS.forEach(function(g){
    var h=document.createElement('h4');h.textContent=g.t;box.appendChild(h);
    var grid=document.createElement('div');grid.className='sws';
    g.i.forEach(function(x){
      var b=document.createElement('button');b.type='button';b.className='sw'+(x[0]===cur?' act':'');
      b.style.background=x[1].sw;
      b.addEventListener('click',function(){$('bmsg').textContent='';setBg(x[0])});grid.appendChild(b);
    });
    box.appendChild(grid);
  });
  $('bgUrl').value=cur.indexOf('url:')===0?cur.slice(4):'';
  $('rBlur').value=parseInt(uget('blur'),10)||0;
  $('rDim').value=uget('dim')===null?0:(parseInt(uget('dim'),10)||0);
}
function fxInput(){uset('blur',$('rBlur').value);uset('dim',$('rDim').value);userFx()}
$('rBlur').addEventListener('input',fxInput);$('rDim').addEventListener('input',fxInput);
function applyUrl(){
  var u=$('bgUrl').value.trim(),m=$('bmsg');
  if(!u)return;
  if(!/^(https?:\/\/|data:image\/)/i.test(u)){m.textContent='Pega un enlace que empiece por http:// o https://';return}
  m.textContent='Cargando…';
  loadImg(u,function(x){
    if(!x){m.textContent='No se pudo cargar esa imagen. Usa el enlace directo a la imagen o súbela desde tu dispositivo.';return}
    uset('bg','url:'+u);applyBg('url:'+u,bgMsg);renderBgPanel();m.textContent='Fondo aplicado.';
  });
}
$('bgUp').addEventListener('click',function(){$('fBg').click()});
$('fBg').addEventListener('change',function(){
  var f=this.files&&this.files[0];this.value='';if(!f||!current)return;
  var m=$('bmsg');m.textContent='Procesando…';
  resizeFile(f,1920,false,function(d){
    if(!d){m.textContent='No se pudo leer esa imagen.';return}
    try{localStorage.setItem(P+current.id+':bgdata',d)}catch(e){m.textContent='La imagen es demasiado grande para guardarla. Prueba con otra más pequeña.';return}
    mem[current.id+':bgdata']=d;uset('bg','file');applyBg('file',bgMsg);renderBgPanel();m.textContent='Fondo aplicado.';
  });
});
$('bgApply').addEventListener('click',applyUrl);
$('bgUrl').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();applyUrl()}});
$('bgUrl').addEventListener('paste',function(){setTimeout(applyUrl,60)});
$('savePin').addEventListener('click',function(){
  var o=$('oldPin').value,n=$('newPin').value,m=$('pmsg');
  if(uh(current,o)!==current.h){m.textContent='El PIN actual no es correcto.';return}
  if(n.length<4){m.textContent='El nuevo PIN debe tener al menos 4 caracteres.';return}
  current.h=uh(current,n);saveUsers();$('oldPin').value='';$('newPin').value='';m.textContent='PIN actualizado.';
});
var cfCb=null;
function askConfirm(t,x,b,cb){$('cfT').textContent=t;$('cfX').textContent=x;$('cfOk').textContent=b;cfCb=cb;$('cmodal').classList.add('open')}
function closeConfirm(){$('cmodal').classList.remove('open');cfCb=null}
$('cfNo').addEventListener('click',closeConfirm);
$('cmodal').addEventListener('mousedown',function(e){if(e.target===this)closeConfirm()});
$('cfOk').addEventListener('click',function(){var f=cfCb;closeConfirm();if(f)f()});
$('delUser').addEventListener('click',function(){
  if(!current)return;var u=current;
  askConfirm('Eliminar usuario','Se borrarán "'+u.name+'" y todos sus datos (notas, accesos y ajustes). Esta acción no se puede deshacer.','Eliminar',function(){
    clearTimeout(saveT);current=null;
    ['notes','links','bg','bgdata','blur','dim','engine','widgets'].forEach(function(k){sDel(u.id+':'+k)});
    users=users.filter(function(x){return x.id!==u.id});saveUsers();logout();
  });
});

/* ---------- Inicio ---------- */
loadUsers();renderUsers();applyBg('f0');
var sid=sGet('session');
for(var i=0;i<users.length;i++){if(users[i].id===sid){enter(users[i]);break}}
})();
</script>
</body>
</html>
